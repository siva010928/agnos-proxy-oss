# Local, opt-in developer hooks. Not a CI gate.
# Install with: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key

  # Ruff lint only (matches the CI `ruff check` gate). Formatting is intentionally
  # NOT enabled here to avoid reformatting the existing codebase.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
