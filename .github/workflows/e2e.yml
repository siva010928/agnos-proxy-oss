name: e2e

# Playwright E2E against the LIVE gateway-served dashboard. This is DELIBERATELY
# not wired to push/pull_request: browser E2E over a booted stack is inherently
# flakier than unit/BVT, so it runs on-demand (workflow_dispatch) and nightly
# (schedule) - the mature-gateway pattern. It NEVER gates a PR (it isn't a PR
# event), so a failure here can't block merges.
on:
  workflow_dispatch: {}
  schedule:
    # Nightly at 06:00 UTC.
    - cron: "0 6 * * *"

# Never let two nightly/dispatch runs stomp each other.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Dashboard E2E (Playwright, ENGINE=echo)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agnos
          POSTGRES_PASSWORD: agnos
          POSTGRES_DB: agnos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agnos -d agnos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Boot the gateway with the $0 echo engine and the demo defaults (allowed
      # because PREVIEW_MODE=true; see gateway/app.py::validate_config). The
      # cold-start seed() provisions the `novatech` client just like the
      # integration job - a fresh CI Postgres is empty, so it fires automatically.
      ENGINE: echo
      PREVIEW_MODE: "true"
      GATEWAY_MASTER_KEY: ci-test-key
      PLATFORM_ADMIN_TOKEN: platform-admin-secret
      GOVERNANCE_DB_URL: postgresql+asyncpg://agnos:agnos@localhost:5432/agnos_test
      KAFKA_BROKERS: ""
      REDIS_URL: ""
      GATEWAY_PORT: "8090"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: poetry.lock

      - name: Install gateway (Python)
        run: |
          pipx install poetry || pip install poetry
          poetry install --without demo --no-interaction

      - name: Build dashboard
        # Build FIRST so frontend/dist/index.html exists - the gateway mounts and
        # serves it at /app when present (see gateway/app.py). E2E specs drive that
        # served dashboard at http://localhost:8090/app.
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Boot gateway (background) + wait for /health
        run: |
          # nohup + & so the gateway survives this step and stays up for the E2E run.
          nohup poetry run python gateway_server.py > gateway.log 2>&1 &
          echo $! > gateway.pid
          echo "waiting up to 60s for gateway /health on :8090 ..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8090/health > /dev/null 2>&1; then
              echo "gateway healthy after ${i}s"
              curl -fsS http://localhost:8090/health; echo
              exit 0
            fi
            if ! kill -0 "$(cat gateway.pid)" 2>/dev/null; then
              echo "::error::gateway process exited during startup"
              echo "----- gateway.log (tail) -----"; tail -n 200 gateway.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::gateway did not become healthy within 60s"
          echo "----- gateway.log (tail) -----"; tail -n 200 gateway.log
          exit 1

      - name: Install Playwright browser (chromium)
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run E2E (Playwright)
        # Best-effort: some engine-specific specs (e.g. real chat/streaming parity)
        # can require a Bifrost sidecar that isn't provisioned here, so this workflow
        # is intentionally non-PR-gating and can be refined later (add a Bifrost
        # service + BIFROST_URL, or tag/skip engine-only specs). E2E_BASE_URL points
        # Playwright at the gateway-served dashboard; CI=1 enables the config's retry.
        env:
          E2E_BASE_URL: http://localhost:8090
          CI: "1"
        run: |
          cd frontend
          npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/e2e/report
          if-no-files-found: ignore
          retention-days: 14

      - name: Gateway log tail
        if: always()
        run: tail -n 200 gateway.log || true
