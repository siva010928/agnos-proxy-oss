version: 2
# Low-noise policy: updates are GROUPED (one PR per ecosystem), SCHEDULED (weekly for
# app deps, monthly for infra), and MAJORS are held for manual review. This opens at
# most a couple of curated PRs - never a daily stream.
updates:
  # Python (Poetry) - one grouped weekly PR of in-range minor/patch bumps.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The OpenAI SDK's majors change types the translator depends on - bump manually.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

  # Dashboard (npm) - one grouped weekly PR of in-range minor/patch bumps.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # UI/tooling majors (React, react-router, recharts, three, vite, typescript) are
      # breaking - handle in dedicated PRs, not autobumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base images - patch/security only (keep Node 20 LTS / Python 3.12), monthly.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/infra/litellm-engine"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions - one grouped monthly PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
