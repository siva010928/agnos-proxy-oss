version: 2
updates:
  # Python (Poetry) - pyproject.toml + poetry.lock at the repo root.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The OpenAI SDK's major versions change request/response types the translator
      # depends on - review and bump these manually, not automatically.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

  # Dashboard (npm) under /frontend.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # UI / tooling majors (React, react-router, recharts, three / @react-three,
      # vite, typescript) are breaking changes - handle in dedicated PRs, not autobumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base images: keep the chosen line (Node 20 LTS, Python 3.12) and take patch/security
  # only - a jump to Node 26 / Python 3.14 can break the build and is a deliberate choice.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/infra/litellm-engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: ["minor", "patch"]
