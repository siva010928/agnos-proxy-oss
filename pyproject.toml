[tool.poetry]
name = "agnos-proxy-llm-gateway"
version = "0.2.0"
description = "Agnos Proxy - the gateway-agnostic control plane for LLM routing, cost-tracking and observability. OpenAI-compatible governance proxy over a swappable BackendEngine."
authors = ["Agnos Proxy Contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "gateway" }]

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }

# OpenAI SDK - request validation + response/chunk Pydantic types
openai = ">=1.55,<4.0"

# Persistence: Postgres (default) + SQLite (fallback)
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" } # 2.0.1
asyncpg = "^0.30.0"
aiosqlite = "^0.20.0"
greenlet = "^3.1.0"

# Encryption (envelope encryption for workspace creds)
cryptography = "^44.0.0"

# Token counting (estimate; chunker / TPM)
tiktoken = "^0.12.0"

# CEL rules for guardrails
cel-python = "^0.1.5"

# Structured logging
structlog = "^24.4.0"

# Kafka governance observer (optional at runtime)
aiokafka = "^0.12.0"

# Prometheus metrics observer (optional)
prometheus-client = "^0.21.0"

# HTTP client (BifrostEngine + demos)
httpx = "^0.28.0"

# Config
python-dotenv = "^1.0.0"

# DirectEngine (proof-of-swap) - Pydantic AI + boto3 for Bedrock
pydantic-ai = "^1.0.0"
opentelemetry-sdk = "^1.42.1"
opentelemetry-exporter-otlp-proto-grpc = "^1.42.1"
opentelemetry-instrumentation-fastapi = "^0.63b1"
redis = ">=5.0"
itsdangerous = "^2.2.0"

[tool.poetry.group.demo.dependencies]
# Demo components - prove any OpenAI-compatible framework works
langchain = "^1.0"
langchain-openai = "^1.0"
langgraph = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
psutil = "^7.2.2"
ruff = "^0.16.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: opt-in smoke tests that hit a running gateway + real providers (run with -m live)",
    "integration: BVT \u2014 end-to-end tests against a running gateway with ENGINE=echo ($0 upstream)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Meaningful, real rule families: pycodestyle errors (E), Pyflakes (F),
# import sorting (I), flake8-bugbear (B) and pyupgrade (UP).
select = ["E", "F", "I", "B", "UP"]
# This package predates linting. To adopt Ruff additively (no mass reformat and
# without rewriting files that are being changed elsewhere), the specific codes
# already tripped by existing sources are grandfathered here. Every other rule in
# the E/F/I/B/UP families stays active for new code. These can be removed one at a
# time in dedicated cleanup PRs.
ignore = [
    "E401",  # multiple imports on one line
    "E402",  # module import not at top of file
    "E501",  # line too long (soft limit; some legacy lines exceed line-length)
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E741",  # ambiguous variable name
    "F401",  # unused import (import hygiene; incremental cleanup)
    "F541",  # f-string without any placeholders
    "F601",  # use of == with repeated dict key literal
    "F821",  # undefined name (pre-existing; revisit during cleanup)
    "F841",  # local variable assigned but never used
    "I001",  # unsorted imports (import ordering; incremental cleanup)
    "B007",  # loop control variable not used within the loop body
    "B008",  # function call in default argument
    "B023",  # function definition uses loop variable
    "B027",  # empty method in abstract base class without abstract decorator
    "B904",  # raise without from inside except
    "B905",  # zip() without explicit strict=
    "UP017", # datetime.timezone.utc alias
    "UP032", # use f-string instead of format call
    "UP035", # deprecated import
    "UP037", # remove quotes from type annotation
    "UP041", # timeout error alias
]

[tool.ruff.lint.per-file-ignores]
# Tests and demos intentionally use relaxed style (top-level side effects,
# unused imports for fixtures/illustration, long inline strings, bugbear patterns).
"tests/**" = ["E402", "F401", "B", "E501"]
"demo/**" = ["E402", "F401", "B", "E501"]

[tool.mypy]
# Local convenience only - mypy is intentionally NOT a CI gate. Kept lenient so it
# is useful for spot-checking without blocking on the existing untyped surface.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
