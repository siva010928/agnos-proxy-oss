{{- /*
Bundled Redis for distributed rate-limiting across gateway replicas (Deployment +
Service). Gated on redis.enabled. Ephemeral by design - rate-limit counters are
transient; no PVC. Point at an external Redis by setting redis.enabled=false and
redis.url.
*/ -}}
{{- if .Values.redis.enabled -}}
{{- $redis := include "agnos-proxy.redis.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $redis }}
  labels:
    {{- include "agnos-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agnos-proxy.redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agnos-proxy.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $redis }}
  labels:
    {{- include "agnos-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "agnos-proxy.redis.selectorLabels" . | nindent 4 }}
{{- end }}
