{{- /*
Chart-managed gateway Secret. Skipped entirely when .Values.existingSecret is set
(you bring your own). Blank secret values are generated with randAlphaNum and then
PERSISTED across upgrades: we lookup() the live Secret and reuse its stored values,
so `helm upgrade` never rotates a generated GATEWAY_MASTER_KEY (which would orphan
every encrypted workspace credential). See _helpers.tpl -> resolveSecret.

Note: `helm template`/`--dry-run` has no cluster to lookup(), so generated values
appear random on each render there - that is expected and only affects dry output.
*/ -}}
{{- if not .Values.existingSecret }}
{{- $secretName := printf "%s-secrets" (include "agnos-proxy.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "agnos-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  GATEWAY_MASTER_KEY: {{ include "agnos-proxy.resolveSecret" (dict "provided" .Values.secrets.gatewayMasterKey "existing" $existing "key" "GATEWAY_MASTER_KEY" "len" 40) | b64enc | quote }}
  PLATFORM_ADMIN_TOKEN: {{ include "agnos-proxy.resolveSecret" (dict "provided" .Values.secrets.platformAdminToken "existing" $existing "key" "PLATFORM_ADMIN_TOKEN" "len" 40) | b64enc | quote }}
  SESSION_SECRET: {{ include "agnos-proxy.resolveSecret" (dict "provided" .Values.secrets.sessionSecret "existing" $existing "key" "SESSION_SECRET" "len" 40) | b64enc | quote }}
  DASHBOARD_ADMIN_PASSWORD: {{ include "agnos-proxy.resolveSecret" (dict "provided" .Values.secrets.dashboardAdminPassword "existing" $existing "key" "DASHBOARD_ADMIN_PASSWORD" "len" 24) | b64enc | quote }}
{{- $providerKeys := dict }}
{{- range $k, $v := .Values.providerKeys }}
{{- if $v }}
{{- $_ := set $providerKeys $k $v }}
{{- end }}
{{- end }}
{{- if $providerKeys }}
stringData:
  {{- range $k, $v := $providerKeys }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
